# Cancello dei test: giro rapido delle prove (~1,5 min in tutto), ogni notte dopo le 00.
# Verde = si può andare online. Rosso = qualcosa si è rotto: il dettaglio è nel registro del passo "Giro rapido".
# Dal 18/11/2026 gira solo di notte dopo le 00 (niente controlli a ogni modifica): da qui si lancia a mano con "Run workflow".
name: Cancello dei test

on:
  # Dal 18/11/2026 (decisione di Luigi alle 21:47): tutti i controlli solo di notte, dopo mezzanotte. La sera le modifiche
  # vanno online all'istante, senza aspettare il cancello. 23:05 UTC = 00:05 in Italia d'inverno (01:05 d'estate).
  schedule:
    - cron: '5 23 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'rapido oppure tutto'
        default: rapido

concurrency:
  group: cancello-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparazione (wrangler, Playwright, three r128)
        run: |
          npm ci --no-audit --no-fund
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          mkdir -p ~/three && cd ~/three && npm pack three@0.128.0 >/dev/null && tar xzf three-0.128.0.tgz
      - name: Giro rapido
        env:
          WRANGLER_SEND_METRICS: 'false'
          THREE_JS: /home/runner/three/package/build/three.min.js
        run: |
          set -o pipefail
          bash tools/verifica/cancello.sh ${{ github.event.inputs.modo || 'rapido' }} 2>&1 | tee /tmp/cyf-giro.log
      - name: Prove fallite in breve (si leggono anche dalle API di GitHub, come annotazioni)
        if: failure()
        run: |
          grep -E "✗|Traceback|Error|FALLIT" /tmp/cyf-giro.log | head -25 | cut -c1-900 | sed 's/^/::error::/' || true
          grep -B2 -A12 "Traceback" /tmp/cyf-giro.log | tail -40 | cut -c1-600 | sed 's/^/::warning::/' || true
      - name: Registro del server locale (se qualcosa è andato storto)
        if: failure()
        run: tail -100 /tmp/cyf-wrangler.log || true
